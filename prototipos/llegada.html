<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La llegada · prototipo · Crea tu cromo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,900&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
/* Escena puente entre El tren y La Selección: sin decisiones, del día a la noche.
   Cada cuadro entra con un fundido y un movimiento lento de cámara; se puede adelantar o saltar. */
:root{
  --noche:#0f0d1b; --mostaza:#e3a93b; --mostaza2:#f4cf7e; --tomate:#d2492f; --lila:#b3a6de; --perg2:#d9c9a3; --crema:#efe6d6;
  --t:'IM Fell English',Georgia,serif; --d:'Bodoni Moda',Georgia,serif; --sc:'IM Fell English SC',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--noche);color:var(--crema);font:400 18px/1.5 var(--t);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mostaza2);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Cuadros a pantalla completa, fundidos con la noche ---------- */
.lienzo{position:fixed;inset:0;overflow:hidden;
  -webkit-mask-image:radial-gradient(ellipse 80% 78% at 50% 46%,#000 52%,transparent 97%);
          mask-image:radial-gradient(ellipse 80% 78% at 50% 46%,#000 52%,transparent 97%)}
.cuadro{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;opacity:0;transition:opacity 1.6s ease;filter:sepia(.1) contrast(1.05);will-change:transform,opacity}
.cuadro.on{opacity:1}
/* el tono del aire baja del día a la noche a medida que avanza el viaje */
.aire{position:fixed;inset:0;pointer-events:none;background:var(--tono,transparent);mix-blend-mode:multiply;transition:background 3s ease}
.viñeta{position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 52%,rgba(15,13,27,.88) 86%)}

/* ---------- Texto: una línea por cuadro, abajo y al centro ---------- */
.linea{position:fixed;left:0;right:0;bottom:clamp(110px,16svh,170px);z-index:5;padding:0 24px;text-align:center}
.linea p{max-width:30em;margin:0 auto;font-style:italic;font-size:clamp(21px,5vw,28px);line-height:1.4;text-shadow:0 2px 16px rgba(15,13,27,.95),0 0 4px rgba(15,13,27,.8)}
.w{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(4px);animation:enfoca .75s ease forwards}
.lugar{display:block;font:400 15px var(--sc);letter-spacing:.12em;color:var(--lila);margin:0 0 8px;opacity:0;animation:enfoca .8s ease forwards}

/* ---------- Barra: sonido y saltar ---------- */
.barra{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
.icono{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;background:rgba(15,13,27,.55);border:1px solid rgba(243,207,126,.35);border-radius:22px;color:var(--crema);font:400 15px var(--sc);letter-spacing:.06em}
.icono svg{width:20px;height:20px}
.icono[hidden]{display:none}
.icono[aria-pressed="true"]{border-color:var(--mostaza);color:var(--mostaza2);box-shadow:0 0 14px rgba(227,169,59,.35)}

/* ---------- Avance: un hilo de tinta, no velas ---------- */
.hilo{position:fixed;left:50%;bottom:clamp(84px,11svh,120px);transform:translateX(-50%);width:min(220px,50vw);height:1.5px;background:rgba(217,201,163,.18);z-index:5}
.hilo i{position:absolute;inset:0 auto 0 0;width:0;background:var(--mostaza);box-shadow:0 0 8px rgba(227,169,59,.6);transition:width .6s ease}

/* ---------- Final: entrar al Gran Comedor ---------- */
.final{position:fixed;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));z-index:6;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease}
.final.on{opacity:1;pointer-events:auto;transform:none}
.otra{background:none;border:0;color:var(--lila);text-decoration:underline;text-underline-offset:4px;font-size:16px;min-height:40px}
.toca{position:fixed;inset:0;z-index:3;background:none;border:0;cursor:pointer}
.toca:focus-visible{outline:none}

/* Seguir: cartela art nouveau. Los remates son SVG (latigazo de ancho variable que nace del rombo);
   las reglas de arriba y abajo siguen en CSS, así el botón se estira con el texto. */
.seguir{--o-estructura:var(--mostaza);--o-filamento:var(--perg2);--o-joya:var(--tomate);--o-texto:var(--mostaza2);
  position:relative;height:64px;min-width:190px;padding:0 64px;border:0;background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(227,169,59,.12),rgba(15,13,27,.0) 70%);
  color:var(--o-texto);font:900 21px/64px var(--d);letter-spacing:.03em;white-space:nowrap;transition:color .25s,filter .3s}
.seguir::before,.seguir::after{content:"";position:absolute;left:55px;right:55px;height:1.5px;background:var(--o-estructura);transition:background .25s}
.seguir::before{top:5.25px}.seguir::after{bottom:5.25px}
.seguir svg{position:absolute;top:0;width:56px;height:64px;overflow:visible}
.seguir .izq{left:0}.seguir .der{right:0;transform:scaleX(-1)}
@media (hover:hover){.seguir:not(:disabled):hover{--o-estructura:var(--mostaza2);--o-filamento:#fff2cf;--o-texto:#fff7e6;filter:drop-shadow(0 0 10px rgba(243,185,95,.45))}}
.seguir:not(:disabled):active{filter:drop-shadow(0 0 16px rgba(243,185,95,.7))}
.seguir:disabled{--o-estructura:#4e4769;--o-filamento:#433d5d;--o-joya:#5c5379;--o-texto:#8a83a8;background:none;cursor:not-allowed}
.seguir:focus-visible{outline:none;filter:drop-shadow(0 0 10px rgba(243,185,95,.55))}

@keyframes enfoca{to{opacity:1;filter:none;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.3s!important}
  .w,.lugar{opacity:1;filter:none;transform:none}
}
</style>
</head>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const QUIETO=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Cuadros de la biblia visual de GG (arte/llegada-NN.webp).
   foco: dónde está lo importante en pantallas angostas. cam: desde y hasta [escala, x %, y %]. tono: el aire del momento. */
const C=[
 {f:'llegada-01',lugar:'El Expreso, por la tarde',txt:'A media tarde pasa el carrito de golosinas. Nadie se resiste.',foco:'50% 50%',cam:[[1.04,0,0],[1.12,-2,1]],tono:'rgba(255,236,200,.0)'},
 {f:'llegada-02',txt:'Por la ventana, los campos se vuelven colinas y las colinas, montañas.',foco:'50% 50%',cam:[[1.06,0,0],[1.16,0,-1]],tono:'rgba(255,214,170,.10)'},
 {f:'llegada-03',lugar:'Al final de las vías',txt:'Cuando el tren por fin se detiene, ya es casi de noche.',foco:'62% 50%',cam:[[1.10,3,0],[1.03,-2,0]],tono:'rgba(170,140,190,.14)'},
 {f:'llegada-04',txt:'Los de primer año no siguen el camino: cruzan por el agua.',foco:'34% 55%',cam:[[1.04,2,1],[1.12,-1,-1]],tono:'rgba(120,110,170,.18)'},
 {f:'llegada-05',txt:'Y al doblar el peñasco, lo ves.',foco:'50% 40%',cam:[[1.16,0,3],[1.04,0,0]],tono:'rgba(105,95,160,.20)',lento:1},
 {f:'llegada-06',txt:'Una escalera de piedra sube desde el muelle hasta las puertas.',foco:'72% 50%',cam:[[1.05,-2,0],[1.13,-4,-2]],tono:'rgba(95,85,150,.24)'},
 {f:'llegada-07',lugar:'El Gran Comedor',txt:'Adentro, el techo no es un techo: es el cielo de esta misma noche.',foco:'50% 40%',cam:[[1.02,0,2],[1.14,0,-2]],tono:'rgba(90,80,150,.18)',fin:1}
];
const DUR=QUIETO?5200:5600;
C.forEach(c=>{const im=new Image();im.src=`../arte/${c.f}.webp`});

/* ---------- Música ---------- */
let son=false,musica=null;
function funde(a,hasta,ms){return new Promise(r=>{const desde=a.volume,t0=performance.now();
  const paso=t=>{const k=Math.min(1,(t-t0)/ms);a.volume=Math.min(1,Math.max(0,desde+(hasta-desde)*k));k<1?requestAnimationFrame(paso):r()};requestAnimationFrame(paso)})}
$('#btn-son').addEventListener('click',ev=>{ev.stopPropagation();son=!son;$('#btn-son').setAttribute('aria-pressed',son);
  if(son){if(!musica){musica=new Audio('../audio/musica-partida-2020.mp3');musica.loop=true;}musica.volume=0;musica.play().then(()=>funde(musica,.42,1800)).catch(()=>{});}
  else if(musica)funde(musica,0,500).then(()=>musica.pause());});

/* ---------- Reproducción ---------- */
let i=-1,capaA=true,reloj=null,anim=null;
function palabras(t,desde=0){let n=desde;return t.split(' ').map(w=>`<span class="w" style="animation-delay:${(n++)*70}ms">${w}</span>`).join(' ');}
function mostrar(k){
  i=k;const c=C[k];clearTimeout(reloj);
  const a=$(capaA?'#cuadroB':'#cuadroA'),b=$(capaA?'#cuadroA':'#cuadroB');capaA=!capaA;
  a.style.objectPosition=c.foco;
  const arranca=()=>{a.classList.add('on');b.classList.remove('on');
    if(anim)anim.cancel?.();
    if(!QUIETO){const [d,h]=c.cam,dur=DUR*(c.lento?1.5:1)+1800;
      anim=a.animate([{transform:`scale(${d[0]}) translate(${d[1]}%,${d[2]}%)`},{transform:`scale(${h[0]}) translate(${h[1]}%,${h[2]}%)`}],{duration:dur,easing:'ease-in-out',fill:'forwards'});}};
  if(a.getAttribute('src')===`../arte/${c.f}.webp`&&a.complete)arranca();else{a.onload=arranca;a.src=`../arte/${c.f}.webp`;}
  document.documentElement.style.setProperty('--tono',c.tono);$('#aire').style.background=c.tono;
  $('#linea').innerHTML=`${c.lugar?`<span class="lugar">${c.lugar}</span>`:''}<p>${palabras(c.txt,c.lugar?3:0)}</p>`;
  $('#hilo').style.width=`${(k+1)/C.length*100}%`;
  $('#final').classList.toggle('on',!!c.fin);$('#saltar').hidden=!!c.fin;$('#toca').hidden=!!c.fin;
  if(c.fin){setTimeout(()=>$('#seguir').focus({preventScroll:true}),900);return;}
  reloj=setTimeout(()=>mostrar(k+1),DUR*(c.lento?1.5:1));
}
function siguiente(){if(i<C.length-1)mostrar(i+1);}
$('#toca').addEventListener('click',siguiente);
$('#saltar').addEventListener('click',ev=>{ev.stopPropagation();mostrar(C.length-1);});
$('#otra').addEventListener('click',()=>mostrar(0));
$('#seguir').addEventListener('click',()=>{$('#final').classList.remove('on');$('#linea').innerHTML=`<span class="lugar">Prototipo</span><p>En la herramienta completa, acá empieza La Selección.</p>`;setTimeout(()=>$('#final').classList.add('on'),2400);});
document.addEventListener('keydown',ev=>{
  if(ev.key===' '||ev.key==='ArrowRight'||ev.key==='Enter'){if(i<C.length-1){siguiente();ev.preventDefault();}}
  else if(ev.key==='Escape'){mostrar(C.length-1);}
});
mostrar(0);
})();
</script>
</body>
</html>
